<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Dashboard</title>

    <meta name="theme-color" content="#111827">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <script src="config.js"></script>
</head>
<body>

<header>
    <h1>🎮 Creator Dashboard</h1>
    <p>Roblox & YouTube Live Stats</p>
</header>

<main>

<div class="dashboard">

    <!-- Roblox Card -->
    <section class="card">

        <h2>🎮 Roblox</h2>

        <img
            id="rbxAvatar"
            class="avatar"
            src=""
            alt="Avatar">

        <h3 id="rbxName">Loading...</h3>

        <div class="stat">
            <span>Username</span>
            <strong id="rbxUsername">Loading...</strong>
        </div>

        <div class="stat">
            <span>User ID</span>
            <strong id="rbxID">--</strong>
        </div>

    </section>

    <!-- YouTube Card -->
    <section class="card">

        <h2>📺 YouTube</h2>

        <div class="stat">
            <span>Subscribers</span>
            <strong id="ytSubs">--</strong>
        </div>

        <div class="stat">
            <span>Views</span>
            <strong id="ytViews">--</strong>
        </div>

        <div class="stat">
            <span>Videos</span>
            <strong id="ytVideos">--</strong>
        </div>

    </section>

    <!-- Dashboard -->
    <section class="card">

        <h2>⚙ Dashboard</h2>

        <div class="stat">
            <span>Last Updated</span>
            <strong id="lastUpdated">Never</strong>
        </div>

        <button onclick="refreshDashboard()">
            Refresh
        </button>

    </section>

</div>

</main>

<footer>
    Creator Dashboard
</footer>

<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
    });
}
</script>

</body>
</html>
